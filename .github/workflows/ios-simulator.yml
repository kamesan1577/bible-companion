name: Build iOS Simulator app

# Manual only. Artifact upload remains an explicit opt-in.
on:
  workflow_dispatch:
    inputs:
      ui_suite:
        description: Full merge gate or artwork-only diagnostic (never merge acceptance)
        type: choice
        options: [all, artwork]
        default: all
      upload_artifacts:
        description: Upload app, screenshots, and Xcode results (may incur storage charges)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare existing Apple toolchain
        timeout-minutes: 6
        run: |
          test -d "$DEVELOPER_DIR"
          git rev-parse HEAD
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
          test ! -e apps/ios/Config/Local.private.xcconfig
      - name: Validate simulator ownership helper
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Run the same build, extension verification, core and UI harness as local
        timeout-minutes: 90
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ios-results"
          # Own device, boot completion, jobs=2, explicit install, all current core/UI tests.
          # UI uses local ad-hoc Simulator signatures, never a developer identity.
          # Per-command limits remain boot 5m, build 12m, core 10m and UI 60m (98 UI methods at integration).
          if [[ "${{ inputs.ui_suite }}" == "artwork" ]]; then
            make ios-ui UI_CLASS=ArtworkCatalogUITests 2>&1
          else
            make ios-ui 2>&1
          fi | tee "$RUNNER_TEMP/ios-results/harness.log"
      - name: Package simulator app without changing executable modes
        run: |
          tar -czf "$RUNNER_TEMP/ios-results/BibleCompanion-simulator.tar.gz" \
            -C .cache/harness/ios-derived/Build/Products/Debug-iphonesimulator BibleCompanion.app
      - name: Upload evidence only when requested
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-results/
            .cache/harness/ios-ui-*/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
      - name: Record scope of this run
        if: ${{ always() }}
        run: |
          {
            echo '## iOS Simulator validation'
            echo 'The shared make ios-ui command owns and removes its dedicated device; no peer simulator is targeted.'
            echo 'UI suite: ${{ inputs.ui_suite }}. Artwork-only runs are diagnostic and cannot establish merge acceptance.'
            echo 'Build/resource verification, core tests and all native UI assertions must pass. No automatic test retries.'
            echo 'Artifacts are uploaded only with upload_artifacts. Otherwise only run logs are retained.'
            echo 'The checked-in endpoint is unconfigured; no backend or AI provider is enabled.'
            echo 'A green run does not establish physical signing, SideStore, App Group delivery, full visual or accessibility acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"
