name: Validate locally reproducible code
# Manual-only until private repository access and Actions quota are verified.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified 2026-10-13
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/diagnostics/no-external-network.cjs
      - run: npm run openapi && git diff --exit-code -- docs/openapi.json
      - run: npm run migrate && npm run migrate
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/diagnostics/no-external-network.cjs
      - run: npm run infra -- validate-config
      - run: npm run deploy:dry-run
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/diagnostics/no-external-network.cjs
      - run: npm audit --audit-level=high
# No deployment, remote migration, credential generation, or provider invocation.
