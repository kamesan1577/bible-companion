name: BibleCompanion
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
packages:
  CompanionCore:
    path: .
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    MARKETING_VERSION: 0.1.12
    CURRENT_PROJECT_VERSION: 13
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
targets:
  BibleCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources/Assets.xcassets
      - path: Sources/App
      - path: Tests/UIBaseline018
      - path: Sources/Services
      - path: Sources/Features
      - path: Sources/DesignSystem
      - path: Config/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CompanionCore
      - target: BibleShare
        embed: true
  BibleShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Sources/DesignSystem/SharedScriptureHeader.swift
      - path: Sources/DesignSystem/OfflineEntityPane.swift
      - path: Sources/DesignSystem/BibleComponents.swift
      - path: Sources/DesignSystem/BibleTheme.swift
      - path: Sources/DesignSystem/BibleTokens.generated.swift
      - path: Config/Share/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Services/LocalStorage.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID).Share
        INFOPLIST_FILE: Config/Share-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Share.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: CompanionCore
  CompanionCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures, UIBaseline018]
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID).CoreTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: CompanionCore
  ReadingInteractionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIBLE_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BibleCompanion
    dependencies:
      - target: BibleCompanion
schemes:
  ReadingInteractionUI:
    build:
      targets:
        BibleCompanion: all
        ReadingInteractionUITests: [test]
    test:
      targets: [ReadingInteractionUITests]
  BibleCompanion:
    build:
      targets:
        BibleCompanion: all
    test:
      targets:
        - CompanionCoreTests
